<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    body{
      background-color: hsl(212, 45%, 89%) ;
 height: 90vh;
    }
    .all{ 
       margin-left: auto;
       margin-right: auto;
       width: 240px;
       height: auto;
       background-color: white;
       border-radius: 25px;
       padding: 5px;
       margin-top: 150px;
    }
    img{
      border-radius: 25px;
      margin: 6px;
    }
    p.f{
      text-align: center;
      color: hsl(218, 44%, 22%);
      font-size: 20px;
      font-weight: bold;
    }
    p{text-align: center;
       font-size: 15px;
      color:  hsl(216, 15%, 48%);}

    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
    @media(max-width:340px){
      body{height: 50vh;}
    }
  </style>
</head> 
<body>
<div class="all">
  <img src="images\image-qr-code.png" width="220px" height="200px">
  <p class="f"> Improve your front-end<br> skills by building projects</p>
  <p> Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
</div>
<br>
 
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/ameer-dev-A">Ameer</a>.
  </footer>
</body>
</html>
